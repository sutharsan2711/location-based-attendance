# Server Port & Context Path
server.port=8090
server.servlet.context-path=/api

# Database Connection Settings
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sutharsan}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# HS256 requires a secret key of at least 256 bits (32 characters)
jwt.secret=${JWT_SECRET:9a62aa5f17d3d2a71d6f5f9a62aa5f17d3d2a71d6f5f9a62aa5f17d3d2a71d6f5f}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Security Configuration
security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5200,http://localhost:5201,http://localhost:5202}

# Application Timezone
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Kolkata}
